# AI 学习路线图 - 6 层架构
# 每层：
#   id, icon, color
#   name/subtitle (bilingual)
#   categories: 对应 categories.yaml 的 slug 列表，用于统计 upcoming 数量
#   tutorials: 已显式挑出的 slug 列表（已发布的直接显示在卡片上）

layers:
  - id: foundation
    icon: "🧠"
    color: violet
    name:
      zh: 大脑层
      en: Foundation
    subtitle:
      zh: 读懂 LLM 原理，建立 AI 系统思维
      en: Understand how LLMs really work and think in systems
    emphasis: deep
    categories: [mind]
    tutorials:
      - chatgpt-prompts
      - feynman-technique

  - id: tools
    icon: "🛠️"
    color: blue
    name:
      zh: 工具层
      en: AI Tools
    subtitle:
      zh: "工程师视角的 AI 工具链：Cursor / Claude / ChatGPT"
      en: "AI toolchain for builders: Cursor, Claude, ChatGPT"
    emphasis: core
    categories: [ai-tools, office]
    tutorials:
      - chatgpt-content-30days
      - cursor-basics
      - claude-prd
      - ai-weekly-report
      - ppt-makeover
      - resume-ai-rewrite
      - notion-second-brain

  - id: create
    icon: "✨"
    color: pink
    name:
      zh: 创作层
      en: Create
    subtitle:
      zh: 用 AI 做内容、图像、视频（创作者可选）
      en: AI for content, images, and video (optional for creators)
    emphasis: side
    categories: [creators, design]
    tutorials:
      - midjourney-commercial
      - xiaohongshu-launch
      - viral-headlines
      - short-video-structure
      - desk-repair-video

  - id: build
    icon: "⚙️"
    color: green
    name:
      zh: 构建层
      en: Build
    subtitle:
      zh: 用 AI 写代码、搭服务、做自动化流水线（深度推荐）
      en: Code, ship services, and automate real pipelines with AI
    emphasis: deep
    categories: [code, automation]
    tutorials:
      - claude-code-basics
      - python-basics
      - git-basics
      - docker-basics
      - deploy-first-site
      - n8n-automation
      - web-scraping
      - langchain-basics

  - id: grow
    icon: "📈"
    color: orange
    name:
      zh: 增长层
      en: Grow
    subtitle:
      zh: "把技术变成产品：PMF、增长、留存"
      en: "Turn tech into product — PMF, growth, retention"
    emphasis: core
    categories: [product, marketing]
    tutorials:
      - competitive-analysis
      - user-interview-1hour
      - ai-customer-service
      - figma-basics

  - id: monetize
    icon: "💰"
    color: yellow
    name:
      zh: 变现层
      en: Monetize
    subtitle:
      zh: "独立开发者的变现路径：Indie Hacker / 副业现金流"
      en: "Indie hacker monetization — side income and passive revenue"
    emphasis: core
    categories: [side-hustle]
    tutorials:
      - xianyu-first-sale
      - paid-newsletter
      - app-idea-validation
      - app-mvp-swiftui
      - app-store-aso
      - app-cold-start
      - app-conversion-retention
      - app-growth-loop
      - app-niche-positioning
      - app-playbook
